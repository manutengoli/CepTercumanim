
name: CepTercumanim APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o CepTercumanim_Telefondan_APK_Paketi.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: CepTercumanim_Android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CepTercumanim-APK
          path: CepTercumanim_Android/app/build/outputs/apk/debug/app-debug.apk
